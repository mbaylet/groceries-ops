  - { id: pain, query: baguette, unit: kg, match: [pain, baguette, chapelure], must: [baguette, pain], exclude: [epice, sans gluten, burger, hot dog, grille], sizes: { piece: 250 } }
  # Crémerie
  - { id: creme, query: crème fraîche, unit: l, match: [creme], must: [creme fraiche, creme legere, creme uht, creme liquide, creme fluide, creme entiere, creme epaisse, creme semi], exclude: [dessert, glace, marron, patissiere, soja, coco, avoine, chocolat, caramel, vanille, savon, mascarpone], sizes: { pot: 200, sachet: 200, brique: 200 } }
  - { id: lait, query: lait demi-écrémé, unit: l, match: [lait], must: [lait], exclude: [coco, amande, avoine, soja, bebe, croissance, chocolat, poudre, concentre, sans lactose] }
  - { id: beurre, query: beurre doux, unit: kg, match: [beurre], must: [beurre], exclude: [cacahuete, biscuit, sable, sauce, assaisonnement] }
  - { id: oeuf, query: oeufs, unit: u, match: [oeuf], must: [oeuf], exclude: [chocolat, sauce], sizes: { piece: 60 } }
  - { id: fromage-rape, query: fromage râpé, unit: kg, match: [fromage rape, gruyere, emmental, comte, mozzarella, chevre, feta, fromage], must: [fromage rape, emmental, gruyere, comte, mozzarella, rape], exclude: [parmesan, parmigiano, sauce, plat, carotte, celeri, bio mifroma] }
  - { id: parmesan, query: parmesan, unit: kg, match: [parmesan, parmigiano], must: [parmesan, parmigiano, fromage rape parmigiano], exclude: [sauce, chips, biscuit, tuile, crouton] }
  - { id: yaourt, query: yaourt nature, unit: kg, match: [yaourt, fromage blanc, mascarpone], must: [yaourt], exclude: [fruit, boire, vanille, citron, fraise], sizes: { piece: 125, pot: 125 } }
  # Divers
  - { id: lait-de-coco, query: lait de coco, unit: l, match: [lait de coco, creme de coco], must: [lait de coco], exclude: [sauce, boisson, curry], sizes: { boite: 400, brique: 200, piece: 400 } }
  - { id: tomate-conserve, query: tomates concassées, unit: kg, match: [tomate concassee, tomate pelee, pulpe de tomate, coulis de tomate, sauce tomate, concentre de tomate, tomate en boite], must: [concasse, tomate concassee, tomate pelee, pulpe, coulis], exclude: [piment, pizza], sizes: { boite: 400, piece: 400 } }
  - { id: vin-blanc, query: vin blanc sec, unit: l, match: [vin blanc], must: [vin blanc], exclude: [vinaigre, sauce] }
